name: run-tests

on: [push]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: [12.*, 13.*]
        include:
          - php: 8.3
            pest: ^4.0
          - php: 8.4
            pest: ^4.0
          - php: 8.5
            pest: ^4.0
          - php: 8.6
            pest: ^5.0
        exclude:
          # Testbench 10 cannot use Pest 5's PHPUnit; Pest 4's ParaTest does not support PHP 8.6.
          - laravel: 12.*
            php: 8.6

    name: PHP${{ matrix.php }} - Laravel${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "pestphp/pest:${{ matrix.pest }}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction
      - name: Execute tests
        run: vendor/bin/pest
